# Opt-in: enable symmetric QMAPv3 UL (UL ~26 Mbit/s instead of ~65 KB/s).
#
# Install as /etc/modprobe.d/ipa-symmetric.conf, then REBOOT — the IPA
# egress pipe reads this only when auto_ipacm builds it at boot (it is
# one-shot; a runtime sysfs write does NOT rebuild the live pipe).
#
# After boot, bring the bearer up with `vendor-init --full-ul` (negotiates
# WDA ul_proto=7, sets rmnet egress-mapv4-checksum on, and forces
# tx-checksum off so the broken IPA UL csum offload is bypassed via a SW
# checksum). See DEVICE-SETUP.md.
#
# To revert: delete this file and reboot (the pipe is one-shot), then bring
# up the bearer with plain `vendor-init` (asymmetric, UL=QMAPv1).
options ipa_driver qmapv3_ul_enable=1
